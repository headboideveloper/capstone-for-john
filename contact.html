<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSpark Hub | Community Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Edu<span>Spark</span></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="courses.html">Courses</a>
                <a href="contact.html" class="active">Community Board</a>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="board-wrapper">
            <h2>Community Feedback & Inquiries</h2>
            <p class="section-subtitle" style="text-align:left; margin-bottom:20px;">
                Share your feedback or ask a question. Posts appear live below!
            </p>

            <form id="feedbackForm" class="feedback-form">
                <div class="form-group">
                    <label for="nameField">Your Name</label>
                    <input type="text" id="nameField" placeholder="e.g. Michael">
                </div>
                <div class="form-group">
                    <label for="msgField">Feedback or Question</label>
                    <textarea id="msgField" rows="3" placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Post to Board</button>
            </form>

            <!-- Dynamic DOM Target Container -->
            <div id="messageBoard" class="message-board">
                <h3>Live Community Feed</h3>
                <!-- Dynamic cards inject here -->
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 EduSpark Learning Hub. All rights reserved.</p>
    </footer>

    <!-- External JS File -->
    <script src="app.js"></script>
</body>
</html>
